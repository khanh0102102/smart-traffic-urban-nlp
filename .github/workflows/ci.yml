name: ST-NLP CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Check JavaScript syntax
        run: |
          node --check frontend/assets/js/api-client.js
          node --check frontend/assets/js/app.js
          node --check frontend/assets/js/admin.js

      - name: Test shared Axios API client
        run: node --test tests/api-client.test.js

      - name: Run unit, API and integration suites with coverage
        run: |
          python -m pytest -q --ignore=tests/e2e --cov=app --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-24-python-coverage
          path: coverage.xml
          if-no-files-found: ignore

  browser-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stnlp_e2e
          POSTGRES_USER: stnlp
          POSTGRES_PASSWORD: stnlp_e2e_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stnlp -d stnlp_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STNLP_E2E_DATABASE_URL: postgresql+psycopg://stnlp:stnlp_e2e_password@127.0.0.1:5432/stnlp_e2e
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run real-browser E2E journey
        env:
          RUN_BROWSER_E2E: "1"
          DATABASE_URL: postgresql+psycopg://stnlp:stnlp_e2e_password@127.0.0.1:5432/stnlp_e2e
          JWT_SECRET_KEY: phase24-github-e2e-secret-0123456789abcdef
          JWT_ALGORITHM: HS256
          JWT_ISSUER: st-nlp-api
          JWT_AUDIENCE: st-nlp-client
        run: python -m pytest tests/e2e/test_browser_journeys.py -q
