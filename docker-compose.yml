services:
  postgres:
    image: postgres:17
    container_name: stnlp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stnlp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stnlp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-stnlp}
    ports:
      - "5432:5432"
    volumes:
      - stnlp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
volumes:
  stnlp_postgres_data:
