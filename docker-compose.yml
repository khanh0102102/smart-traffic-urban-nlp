services:
  db:
    image: mysql:8.4
    container_name: stnlp-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-st_nlp}
      MYSQL_USER: ${MYSQL_USER:-stnlp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "3306:3306"
    volumes:
      - stnlp_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
  api:
    build: .
    container_name: stnlp-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-stnlp}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-st_nlp}?charset=utf8mb4
      MODEL_ARTIFACT_DIR: /app/artifacts
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
    depends_on:
      db:
        condition: service_healthy
volumes:
  stnlp_mysql_data:
