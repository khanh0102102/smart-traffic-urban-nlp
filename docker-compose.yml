services:
  mysql:
    image: mysql:8.4
    container_name: stnlp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
      MYSQL_DATABASE: ${DB_NAME:-stnlp}
      MYSQL_USER: ${DB_USER:-stnlp_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-stnlp_dev_password}
    ports:
      - "3306:3306"
    volumes:
      - stnlp_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  stnlp_mysql_data:
